name: Validar catálogo

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  documentation:
    name: Documentação (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verificar estrutura e links internos
        run: python scripts/verify_repository.py
